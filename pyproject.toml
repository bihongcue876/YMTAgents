[project]
name = "ymt"
version = "0.0.0"
description = "言明通 / YMTAgents - 桌面端个人超级 Agent 工作台"
requires-python = ">=3.14"
dependencies = [
    "pyside6",
    "openai",
    "pydantic>=2",
    "keyring",
    "markdown-it-py",
    "pygments",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/gui", "src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]

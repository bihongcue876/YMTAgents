[project]
name = "ymt"
version = "0.0.0"
description = "言明通 / YMTAgents - 桌面端个人超级 Agent 工作台"
requires-python = ">=3.14"
dependencies = [
    "pyside6",
    "openai",
    "pydantic>=2",
    "keyring",
    "markdown-it-py",
    "pygments",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/gui", "src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp 固定在项目内：pytest 会话开始时会递归清理 basetemp 下的旧目录，
# 默认落在系统 Temp 下会被沙箱/安全策略判定为批量删除而拦截。
addopts = "--basetemp=.pytest_tmp"
